<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dental Clinic - Doctor's Experience</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Ionicons for beautiful icons -->
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</head>
<body>

    <!-- Toggle Button -->
    <button class="nav-toggle" id="navToggle">
        <ion-icon name="menu-outline"></ion-icon>
    </button>

    <!-- Sidebar Navigation -->
    <nav class="navbar" id="navbar">
        <ul class="nav-links">
            <li><a href="index.html">Introduction</a></li>
            <li><a href="experience.html" class="active">Doctor's Experience</a></li>
            <li><a href="staff.html">Staff</a></li>
            <li><a href="contact.html">Contact Us</a></li>
            <li><a href="announcements.html">Announcements</a></li>
            <li><a href="rules.html">Rules and Regulations</a></li>
        </ul>
    </nav>

    <!-- Top Register Button -->
    <div class="top-actions">
        <button class="btn-primary" id="registerBtn">Register with Us</button>
    </div>

    <!-- Floating Chatbot -->
    <div class="chatbot-btn" id="chatbotBtn">
        <ion-icon name="chatbubbles-outline" style="font-size: 24px; color: var(--accent-color);"></ion-icon>
    </div>

    <!-- Main Content -->
    <main id="mainContent">
        
        <!-- Doctor Hero Section -->
        <section class="hero doctor-hero">
            <div class="doctor-hero-content">
                <h1>Know Your Doctor,<br><span>Dr. <span id="doctorNameSpan">...</span></span></h1>
                <p class="staff-hero-sub">Years of dedication, learning, and trusted care.</p>
            </div>
            <div class="doctor-hero-image">
                <img id="doctorProfileImg" src="" alt="Doctor Profile Picture" style="display: none;">
            </div>
        </section>

        <!-- Experience Grid Section -->
        <section class="staff-section" id="experience-section">
            <div class="exp-list" id="experience-grid">
                <!-- Cards will be injected here -->
            </div>
        </section>

    </main>

    <!-- Base JS (for navbar toggle and generic utils) -->
    <script src="js/env.js"></script>
    <script src="js/main.js"></script>
    <!-- Experience specific JS -->
    <script src="js/experience.js"></script>
</body>
</html>
