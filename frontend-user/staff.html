<head>

    <title>Dental Clinic - Staff</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Ionicons for beautiful icons -->
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</head>

<body>

    <!-- Toggle Button -->
    <button class="nav-toggle" id="navToggle">
        <ion-icon name="menu-outline"></ion-icon>

    <!-- Sidebar Navigation -->
    <nav class="navbar" id="navbar">
        <ul class="nav-links">
            <li><a href="index.html">Introduction</a></li>
            <li><a href="experience.html">Doctor's Experience</a></li>
            <li><a href="staff.html" class="active">Staff</a></li>

        </ul>
    </nav>

    <!-- Top Register Button -->
    <div class="top-actions">
        <button class="btn-primary" id="registerBtn">Register with Us</button>

    <div class="chatbot-btn" id="chatbotBtn">
        <ion-icon name="chatbubbles-outline" style="font-size: 24px; color: var(--accent-color);"></ion-icon>

    <!-- Main Content -->
    <main id="mainContent">

        <section class="staff-section" id="current-staff-section" style="display: none;">

            <div class="staff-grid" id="alumni-staff-grid">

            </div>
        </section>

    <!-- Base JS (for navbar toggle and generic utils) -->
    <script src="js/env.js"></script>
    <script src="js/main.js"></script>

    <script src="js/staff.js"></script>
